<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공공계약 운영체제 2026 — 신입사원 계약사무 강의</title>
<style>
:root{
  --bg:#eef1f6;
  --grid:#dbe1ec;
  --panel:#ffffff;
  --panel-2:#f6f8fc;
  --ink:#111827;
  --sub:#4b5563;
  --faint:#8b95a5;
  --line:#e2e6ee;
  --accent:#4338ca;
  --accent-2:#0891b2;
  --accent-soft:#eef0fe;
  --ok:#059669;
  --ok-soft:#ecfdf5;
  --warn:#b45309;
  --warn-soft:#fff7ed;
  --danger:#dc2626;
  --danger-soft:#fef2f2;
  --code-bg:#0f172a;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  --radius:14px;
  --maxw:980px;
}
[data-theme="dark"]{
  --bg:#0b1120;
  --grid:#151d31;
  --panel:#111a2e;
  --panel-2:#0e1526;
  --ink:#e8ecf6;
  --sub:#aab4c8;
  --faint:#6b7690;
  --line:#223050;
  --accent:#818cf8;
  --accent-2:#22d3ee;
  --accent-soft:#1a2140;
  --ok:#34d399;
  --ok-soft:#0d2b22;
  --warn:#fbbf24;
  --warn-soft:#2c220c;
  --danger:#f87171;
  --danger-soft:#2c1414;
  --code-bg:#050a14;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--ink);
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px;
  min-height:100vh;
  transition:background-color .2s, color .2s;
}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}

/* ---------- top bar ---------- */
#topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
[data-theme="dark"] #topbar{background:rgba(11,17,32,.86);}
#topbar-inner{
  max-width:1180px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:16px;
}
#brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;white-space:nowrap;color:var(--ink);}
#brand .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);}
#toc-scroll{
  flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;
  padding:2px 0;
}
#toc-scroll::-webkit-scrollbar{height:4px;}
#toc-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
.toc-chip{
  flex:0 0 auto;font-size:12px;padding:6px 10px;border-radius:20px;
  color:var(--sub);border:1px solid transparent;white-space:nowrap;cursor:pointer;
}
.toc-chip:hover{background:var(--panel-2);text-decoration:none;}
.toc-chip.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700;}
#controls{display:flex;gap:6px;flex:0 0 auto;}
.icon-btn{
  border:1px solid var(--line);background:var(--panel);color:var(--sub);
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ---------- slide area ---------- */
#stage{max-width:var(--maxw);margin:0 auto;padding:28px 20px 140px;}
.slide{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:36px 40px;
  animation:fadeUp .25s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.eyebrow{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.eyebrow .part{
  font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--accent-2);
  background:var(--accent-soft);border-radius:6px;padding:3px 8px;
}
.eyebrow .num{font-size:12px;color:var(--faint);font-family:monospace;}
h1.title{font-size:28px;line-height:1.35;margin:0 0 6px;letter-spacing:-.01em;}
p.subtitle{font-size:15px;color:var(--sub);margin:0 0 26px;line-height:1.6;}
.section-body{font-size:14.5px;line-height:1.7;color:var(--ink);}
.section-body p{margin:0 0 14px;}

/* ---------- generic building blocks ---------- */
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:760px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
}
.card{
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;
}
.card h3{margin:0 0 8px;font-size:14.5px;}
.card p, .card li{font-size:13.5px;color:var(--sub);line-height:1.6;}
.card ul{margin:0;padding-left:18px;}
.big-num{font-size:30px;font-weight:800;color:var(--accent);line-height:1;margin-bottom:4px;}
.big-num.cyan{color:var(--accent-2);}

.badge{
  display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
  border:1px solid var(--line);color:var(--sub);margin-right:4px;
}
.badge.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft);}
.badge.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft);}
.badge.danger{color:var(--danger);border-color:var(--danger);background:var(--danger-soft);}
.badge.accent{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}

.callout{
  border-radius:10px;padding:14px 16px;margin:16px 0;border:1px solid var(--line);
  font-size:13.5px;line-height:1.65;
}
.callout.tip{background:var(--accent-soft);border-color:var(--accent);}
.callout.ok{background:var(--ok-soft);border-color:var(--ok);}
.callout.warn{background:var(--warn-soft);border-color:var(--warn);}
.callout.danger{background:var(--danger-soft);border-color:var(--danger);}
.callout b.lbl{display:block;font-size:11px;letter-spacing:.05em;margin-bottom:6px;text-transform:uppercase;}
.callout ul{margin:6px 0 0;padding-left:18px;}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0;}
table.tbl th, table.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;}
table.tbl th{background:var(--panel-2);font-weight:700;font-size:12.5px;color:var(--sub);}

.flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:14px 0;}
.flow .step{
  flex:1;min-width:140px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;text-align:center;font-size:13px;
}
.flow .step b{display:block;font-size:14px;margin-bottom:2px;}
.flow .arrow{display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:16px;padding:0 2px;}
@media (max-width:760px){.flow{flex-direction:column;}.flow .arrow{transform:rotate(90deg);}}

.step-progress{display:flex;gap:4px;margin-bottom:16px;}
.step-progress i{flex:1;height:4px;border-radius:2px;background:var(--line);}
.step-progress i.on{background:var(--accent);}

.source{margin-top:22px;padding-top:14px;border-top:1px dashed var(--line);font-size:12px;color:var(--faint);}
.source b{color:var(--sub);}

.toc-part{margin-bottom:22px;}
.toc-part h4{font-size:12px;letter-spacing:.06em;color:var(--accent-2);margin:0 0 10px;text-transform:uppercase;}
.toc-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media (max-width:640px){.toc-list{grid-template-columns:1fr;}}
.toc-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel-2);cursor:pointer;font-size:13.5px;
}
.toc-item:hover{border-color:var(--accent);}
.toc-item .n{
  flex:0 0 26px;height:26px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent);
}
.checklist{list-style:none;margin:0;padding:0;}
.checklist li{
  display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;
}
.checklist li:last-child{border-bottom:none;}
.checklist li::before{content:"✓";color:var(--ok);font-weight:800;flex:0 0 auto;}

/* ---------- cover ---------- */
.cover{
  text-align:left;position:relative;overflow:hidden;
}
.cover .pill{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent-2);
  background:var(--accent-soft);border:1px solid var(--accent-2);border-radius:20px;padding:5px 12px;margin-bottom:18px;
}
.cover .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);}
.cover h1{font-size:38px;line-height:1.25;margin:0 0 10px;}
.cover .lead{font-size:16px;color:var(--sub);margin-bottom:22px;}
.cover .meta{font-family:monospace;font-size:12px;color:var(--faint);border-top:1px solid var(--line);padding-top:14px;}

/* ---------- bottom nav ---------- */
#navbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-top:1px solid var(--line);
}
[data-theme="dark"] #navbar{background:rgba(11,17,32,.9);}
#navbar-inner{
  max-width:var(--maxw);margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:12px;
}
.nav-btn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;
}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.nav-btn:disabled{opacity:.35;cursor:default;}
#dots{flex:1;display:flex;justify-content:center;gap:5px;flex-wrap:wrap;}
.dot-btn{width:7px;height:7px;border-radius:50%;background:var(--line);border:none;cursor:pointer;padding:0;}
.dot-btn.active{background:var(--accent);width:16px;border-radius:4px;}
#counter{font-size:12px;color:var(--faint);font-family:monospace;white-space:nowrap;}
#copylink{font-size:12px;}

.hint{position:fixed;right:16px;bottom:60px;font-size:11px;color:var(--faint);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;box-shadow:var(--shadow);display:none;}
@media (min-width:900px){.hint{display:block;}}

@media print{
  #topbar,#navbar,.hint{display:none;}
  .slide{box-shadow:none;border:none;page-break-after:always;}
}
</style>
</head>
<body>

<div id="topbar">

      자의적으로 상대방을 고르는 일을 막기 위한 <b>공정한 절차</b>가 필요합니다. 다음 장부터 배우는
      '일반경쟁 입찰 원칙'은 바로 이 문제의식에서 출발합니다.
    </div>
  `
},

{
  part:"PART 1 · 원칙", title:"계약의 대원칙 — 일반경쟁입찰", subtitle:"공공재원 집행의 투명성과 공정성을 확보하기 위한 기본값(Default)입니다.",
  html:`
    <div class="callout tip">
      <b class="lbl">핵심 조문</b>
      <b>국가계약법 제5조(계약의 원칙)</b> — 계약은 당사자가 대등한 입장에서 서로의 이익을 공정하게 다루어야 하며,
      계약상대자의 계약상 이익을 부당하게 제한하는 특약은 무효입니다(제5조 제3·4항, 2019.11.26. 신설).<br>
      <b>국가계약법 제7조(계약의 방법)</b> — 계약은 원칙적으로 <b>일반경쟁</b>에 부쳐야 하며, 계약의 목적·성질·규모 등을 고려해
      필요한 경우에만 참가자격을 제한(제한경쟁)하거나 지명(지명경쟁)하거나 수의계약을 할 수 있습니다.
    </div>
    <div class="grid grid-3">
      <div class="card"><h3>제한경쟁</h3><p>목적과 규모에 따라 참가자격을 필터링합니다. 예: 지역제한, 중소기업자간 경쟁제품, 실적제한.</p></div>
      <div class="card"><h3>지명경쟁</h3><p>특수한 기술·설비가 필요한 경우 등 조건에 맞는 대상자를 지정하여 경쟁시킵니다.</p></div>
      <div class="card"><h3>수의계약</h3><p>소액·긴급·특허 등 예외적 사유가 있을 때만 경쟁 절차 없이 직접 체결합니다.</p></div>
    </div>
    <div class="callout warn">
      <b class="lbl">신입사원 주의</b>
      창업진흥원은 <b>기타공공기관</b>이므로 국가계약법 체계(기타공공기관 계약사무 운영규정 경유)를 따릅니다.
      지방자치단체가 적용하는 <b>지방계약법</b>과는 근거 법령·금액 기준이 다르므로 혼동하지 않도록 합니다.
    </div>
    <div class="source"><b>근거</b>: 국가계약법 제5조·제7조 / 기타공공기관 계약사무 운영규정(훈령 제152호)</div>
  `
},

{
  part:"PART 1 · 조달방식", title:"조달 방식의 분기 — 자체조달 vs 중앙조달", subtitle:"고시금액을 기준으로 발주 창구(자체조달/중앙조달)가 자동으로 나뉩니다.",
  html:`
    <div class="grid grid-2">
      <div class="card">
        <h3>자체조달 — 창업진흥원 MIS</h3>
        <div class="big-num">2.3억 원 미만</div>
        <p>용역·물품 기준. 공사는 <b>88억 원 미만</b>. 창업진흥원이 직접 발주·계약합니다.</p>
      </div>
      <div class="card">
        <h3>중앙조달 — 조달청 의무 위탁</h3>
        <div class="big-num cyan">2.3억 원 이상</div>
        <p>용역·물품 기준(고시금액). 공사는 <b>88억 원 이상</b>. 조달청에 의무적으로 위탁합니다.</p>
      </div>
    </div>
    <div class="callout tip">
      <b class="lbl">왜 2.3억 원인가</b>
      기획재정부 고시금액(고시 제2024-42호, 적용기간 2025.1.1.~2026.12.31.)상 <b>중앙관서 기준 고시금액은 2억 3천만 원</b>이며,
      창업진흥원은 기타공공기관 운영규정을 통해 이 값을 그대로 준용합니다. 흔히 언급되는 "7.1억 원"은
      정부조달협정 부속서 등재기관에만 적용되는 값으로, 창업진흥원은 해당하지 <b>않습니다</b>.
    </div>
    <div class="callout warn">
      <b class="lbl">2.3억~7.1억 구간 실적제한 시 안전장치 3종</b>
      <ul>
        <li>실적제한이 필요한 사유를 기안 문서에 명시(근거 문서화)</li>
        <li>실적 기준은 해당 계약목적물 규모·양 또는 추정가격의 <b>1배 이내</b>로 한정</li>
        <li>실적제한과 지역제한을 동시에 부과하지 않음</li>
      </ul>
    </div>
    <div class="source"><b>근거</b>: 국가계약법 시행령 제2조 제3호·시행규칙 제25조 / 기획재정부 고시 제2024-42호</div>
  `
},

{
  part:"PART 1 · 계약방법", title:"계약방법 필터링", subtitle:"추정가격과 사업 특성에 따라 적용되는 계약방법이 조건부로 결정됩니다.",
  html:`
    <div class="grid grid-2">
      <div class="card">
        <h3>① 소액수의계약 <span class="badge ok">2천만원 이하</span></h3>
        <p>추정가격 2천만 원 이하인 물품 제조·구매·임차 또는 용역계약. 별도 자격 제한 없이 수의계약이 가능합니다.</p>
      </div>
      <div class="card">
        <h3>② 약자지원 수의계약 <span class="badge ok">2천만원 초과~1억원</span></h3>
        <p>추정가격 2천만 원 초과 1억 원 이하이면서, 소기업·소상공인·벤처기업·창업기업 또는 여성기업·장애인기업·사회적기업 등과
        체결하는 경우 수의계약이 가능합니다.</p>
      </div>
      <div class="card">
        <h3>③ 제한경쟁입찰</h3>
        <p>중소기업자간 경쟁제품 대상이거나 지역·중소기업 등 참가자격을 제한할 필요가 있는 경우에 적용합니다.</p>
      </div>
      <div class="card">
        <h3>④ 협상에 의한 계약</h3>
        <p>전문성·기술성·긴급성이 요구되는 지식기반 용역에 적용합니다. 기술능력평가와 입찰가격평가를 합산해 평가합니다.</p>
      </div>
    </div>
    <div class="callout tip">
      <b class="lbl">협상계약의 평가 비중</b>
      기본 배점은 <b>기술능력평가 70점 : 입찰가격평가 30점</b>이며, 계약예규 등에 따라 <b>±20점</b> 범위에서 조정할 수 있습니다
      (예: 전문성이 특히 중요한 사업은 80:20까지 조정 가능). 추정가격이 고시금액(2.3억 원) 미만인 경우
      기술능력평가 항목 중 <b>수행실적</b> 항목은 평가에서 제외합니다.
    </div>
    <div class="source"><b>근거</b>: 국가계약법 시행령 제26조 제1항 제5호 / 협상에 의한 계약 제안서평가 지침 제14조(2026.8.26. 개정)</div>
  `
},

/* =========================================================================
   렌더링 엔진
   ========================================================================= */
const stage = document.getElementById('stage');
const tocScroll = document.getElementById('toc-scroll');
const dotsWrap = document.getElementById('dots');
const counter = document.getElementById('counter');

function slideLabel(i){
  const s = SLIDES[i];
  return s.cover ? '표지' : (s.title.length > 16 ? s.title.slice(0,14)+'…' : s.title);
}

function buildToc(){
  tocScroll.innerHTML = '';
  SLIDES.forEach((s,i)=>{
    const chip = document.createElement('a');
    chip.className = 'toc-chip';
    chip.href = '#/' + (i+1);
    chip.textContent = (i+1) + '. ' + slideLabel(i);
    chip.dataset.idx = i;
    tocScroll.appendChild(chip);
  });
}

function buildDots(){
  dotsWrap.innerHTML = '';
  SLIDES.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className = 'dot-btn';
    b.title = (i+1)+'. '+slideLabel(i);
    b.addEventListener('click', ()=> go(i+1));
    dotsWrap.appendChild(b);
  });
}

function currentIndex(){
  const n = parseInt((location.hash.match(/#\/(\d+)/)||[])[1], 10);
  if(!n || n<1 || n>SLIDES.length) return 0;
  return n-1;
}

function render(){
  const idx = currentIndex();
  const s = SLIDES[idx];
  const slideEl = document.createElement('div');
  slideEl.className = 'slide' + (s.cover ? ' cover' : '');
  if(s.cover){
    slideEl.innerHTML = s.html;
  } else {
    slideEl.innerHTML = `
      <div class="eyebrow"><span class="part">${s.part}</span><span class="num">${String(idx+1).padStart(2,'0')} / ${String(SLIDES.length).padStart(2,'0')}</span></div>
      <h1 class="title">${s.title}</h1>
      ${s.subtitle ? `<p class="subtitle">${s.subtitle}</p>` : ''}
      <div class="section-body">${s.html}</div>
    `;
  }
  stage.innerHTML = '';
  stage.appendChild(slideEl);

  // toc 활성표시
  [...tocScroll.children].forEach((c,i)=> c.classList.toggle('active', i===idx));
  const active = tocScroll.children[idx];
  if(active) active.scrollIntoView({block:'nearest', inline:'center'});

  // dots
  [...dotsWrap.children].forEach((d,i)=> d.classList.toggle('active', i===idx));

  counter.textContent = (idx+1) + ' / ' + SLIDES.length;
  document.getElementById('btn-prev').disabled = idx===0;
  document.getElementById('btn-next').disabled = idx===SLIDES.length-1;

  // 목차 링크 클릭 이동 (toc slide 내부)
  stage.querySelectorAll('[data-goto]').forEach(el=>{
    el.addEventListener('click', ()=> go(parseInt(el.dataset.goto,10)));
  });

  window.scrollTo({top:0, behavior:'instant'});
}

function go(n){
  n = Math.max(1, Math.min(SLIDES.length, n));
  location.hash = '#/' + n;
}

document.getElementById('btn-prev').addEventListener('click', ()=> go(currentIndex()));
document.getElementById('btn-next').addEventListener('click', ()=> go(currentIndex()+2));

window.addEventListener('hashchange', render);

document.addEventListener('keydown', (e)=>{
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if(e.key === 'ArrowRight' || e.key === 'PageDown'){ go(currentIndex()+2); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ go(currentIndex()); }
  else if(e.key === 'Home'){ go(1); }
  else if(e.key === 'End'){ go(SLIDES.length); }
  else if(e.key.toLowerCase() === 'f'){ toggleFullscreen(); }
  else if(e.key.toLowerCase() === 't'){ toggleTheme(); }
});

/* 테마 */
function toggleTheme(){
  const root = document.documentElement;
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  if(next === 'dark') root.dataset.theme = 'dark'; else delete root.dataset.theme;
  localStorage.setItem('kised-lecture-theme', next);
}
(function initTheme(){
  const saved = localStorage.getItem('kised-lecture-theme');
  if(saved === 'dark') document.documentElement.dataset.theme = 'dark';
})();
document.getElementById('btn-theme').addEventListener('click', toggleTheme);

/* 전체화면 */
function toggleFullscreen(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else { document.exitFullscreen(); }
}
document.getElementById('btn-fs').addEventListener('click', toggleFullscreen);

/* 인쇄 */
document.getElementById('btn-print').addEventListener('click', ()=> window.print());

/* 링크 복사 */
document.getElementById('copylink').addEventListener('click', ()=>{
  const url = location.href;
  navigator.clipboard?.writeText(url).then(()=>{
    const btn = document.getElementById('copylink');
    const old = btn.textContent;
    btn.textContent = '✅ 복사됨';
    setTimeout(()=> btn.textContent = old, 1200);
  }).catch(()=>{});
});

/* 초기화 */
buildToc();
buildDots();
if(!location.hash) location.hash = '#/1';
render();
</script>
